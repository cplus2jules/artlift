[build]
  command = "pip install -r requirements.txt"
  functions = "api"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.9.16"

[[redirects]]
  from = "/*"
  to = "/api/index.py"
  status = 200

[context.production]
  environment = { PYTHON_VERSION = "3.9.16" }

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
